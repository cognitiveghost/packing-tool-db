name: Test, Build and Release

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
    # 'labeled' so applying the windows-build label triggers a build on an
    # already-open PR. The default types do not include it.
    types: [opened, synchronize, reopened, labeled]
  # The Release button: Actions -> this workflow -> Run workflow, on main.
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch
      prerelease:
        description: Mark the release as a pre-release
        type: boolean
        default: false

jobs:
  verify:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          # QtWebEngine's runtime (NSS and X client libs), the same set as
          # shopify-fulfillment-tool's CI, so the packer document tests drive
          # a real Chromium on every PR.
          sudo apt-get update && sudo apt-get install -y libegl1 libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxkbfile1 libxtst6 libxkbcommon0 libgbm1 libasound2t64 libxcb-dri3-0
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Audit dependencies for known vulnerabilities
        run: |
          pip install pip-audit
          pip-audit --skip-editable
      - name: Read the synced commit
        id: pin
        run: |
          sha=$(tr -d '[:space:]' < scripts/shared_synced_from.txt)
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out shopify-fulfillment-tool-db at the synced commit (source of the Supabase migrations)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cognitiveghost/shopify-fulfillment-tool-db
          ref: ${{ steps.pin.outputs.sha }}
          path: fulfilment-ref
          persist-credentials: false
      - name: Set up Supabase CLI
        uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v1
        with:
          version: 3.1.0
      - name: Start local Supabase stack
        # Migrations come from F at the commit pinned in scripts/shared_synced_from.txt: one source.
        run: |
          supabase start --workdir fulfilment-ref
          supabase status --workdir fulfilment-ref -o env | sed -e 's/^API_URL=/SUPABASE_TEST_URL=/' -e 's/^ANON_KEY=/SUPABASE_TEST_ANON_KEY=/' -e 's/^SERVICE_ROLE_KEY=/SUPABASE_TEST_SERVICE_KEY=/' | tr -d '"' | grep '^SUPABASE_TEST_' >> "$GITHUB_ENV"
      - name: Lint (ruff)
        # shared/ is a synced copy of shopify-fulfillment-tool's; it is linted there.
        run: ruff check . --exclude shared --exclude fulfilment-ref
      - name: Import main module
        run: python -c "import main"
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        # Both coverage gates: Python app code (.coveragerc) and the page
        # scripts (tests/js_coverage.py). A plain `python -m pytest` measures nothing.
        run: python scripts/coverage_check.py

  shared-sync-check:
    name: Check shared/ matches shopify-fulfillment-tool at the synced commit
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read the synced commit
        id: pin
        run: |
          sha=$(tr -d '[:space:]' < scripts/shared_synced_from.txt)
          if [[ ! $sha =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::scripts/shared_synced_from.txt must hold one full commit SHA; run scripts/sync_shared.py."
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Check out shopify-fulfillment-tool-db at that commit (canonical shared/ source)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cognitiveghost/shopify-fulfillment-tool-db
          ref: ${{ steps.pin.outputs.sha }}
          path: fulfilment-ref
          persist-credentials: false
      - name: Diff shared/ against the canonical copy
        run: |
          if ! diff -r -x __pycache__ shared fulfilment-ref/shared; then
            echo "::error::shared/ differs from shopify-fulfillment-tool/shared/ at ${{ steps.pin.outputs.sha }}. Never hand-edit packing-tool/shared/: change it in shopify-fulfillment-tool, then run scripts/sync_shared.py."
            exit 1
          fi

  dependabot-automerge:
    name: Auto-merge Dependabot patch and minor updates
    # After the checks above pass on a Dependabot PR; a major bump waits for a person.
    needs: [verify, shared-sync-check]
    if: github.event_name == 'pull_request' && github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Read the update type
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
      - name: Merge
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: gh pr merge --squash "$PR_URL"

  version:
    name: Next Version
    needs: [verify, shared-sync-check]
    # Releases come from main only. On any other branch this job skips, and
    # so do build and release below.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.next.outputs.version }}
    steps:
      - name: Check out code with tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Pick the next version from the tags
        id: next
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          version=$(python scripts/release_version.py next "$BUMP")
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build Executable
    needs: [verify, version]
    runs-on: windows-latest
    # A release (version succeeded), or a PR carrying the windows-build label:
    # Windows-only questions (frozen bundles, RDP) cannot be answered from the
    # Ubuntu dev machine, and the repo is public so the minutes are free.
    # !cancelled() because version is skipped on PRs, and a skipped need would
    # otherwise skip this job too.
    if: >-
      !cancelled() && needs.verify.result == 'success' && (
        needs.version.result == 'success' ||
        (github.event_name == 'pull_request' &&
         contains(github.event.pull_request.labels.*.name, 'windows-build')))
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt
      - name: Stamp the release version
        # PR gate builds skip this and say "dev" in the title.
        if: env.VERSION != ''
        run: python scripts/release_version.py stamp packing_tool/__init__.py $env:VERSION
      - name: Build executable with PyInstaller
        run: pyinstaller main.spec
      - name: Verify bundled assets shipped
        # A missing shared/assets does not degrade: icon() raises during
        # MainWindow construction, and --windowed means the user double-clicks
        # an exe that silently never opens.
        #
        # QtWebEngineProcess.exe and packer.html are the same shape of problem
        # for the order document: PyInstaller's hook-PySide6.QtWebEngineCore is
        # supposed to collect the helper process, and if it silently does not,
        # the only symptom is a dead view discovered over RDP after a full
        # build and a several-hundred-MB download. Fail here instead.
        # app.html is the same for the pages' document, and setup.html for the
        # setup document. kit.css and page.js are
        # shared/web, which both pages load by relative path.
        #
        # qico.dll is Qt's .ico reader: without it brand_icon() loads nothing
        # and the window and taskbar show a blank icon.
        shell: pwsh
        run: |
          foreach ($name in "package.svg", "Inter-Regular.ttf", "QtWebEngineProcess.exe", "packer.html", "app.html", "setup.html", "kit.css", "page.js", "packer-assistant.ico", "qico.dll", "bg.json", "scan-barcode.svg", "download.svg") {
            if (-not (Get-ChildItem -Path "dist\PackerAssistant-DB" -Recurse -Filter $name)) {
              throw "PyInstaller did not bundle $name -- the app would not start."
            }
          }
      - name: Zip the bundle
        shell: pwsh
        run: |
          $name = if ($env:VERSION) { "PackerAssistant-DB-$env:VERSION" } else { "PackerAssistant-DB-gate" }
          Compress-Archive -Path "dist\PackerAssistant-DB\*" -DestinationPath "$name.zip"
      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: PackerAssistant-DB-*.zip
          # Already a zip; re-compressing several hundred MB buys nothing.
          compression-level: 0

  release:
    name: Publish Release
    # Runs only when version and build both succeeded, i.e. on the Release
    # button. A release made with GITHUB_TOKEN would not trigger another
    # workflow, which is why the build lives in this one.
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
      - name: Checksum
        run: sha256sum "PackerAssistant-DB-$VERSION.zip" > "PackerAssistant-DB-$VERSION.zip.sha256"
      - name: Attest build provenance
        # Attestations need a public repo on a user account; the -db forks are private.
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: PackerAssistant-DB-${{ needs.version.outputs.version }}.zip
      - name: Create the release
        # Last, so a failed build or attestation leaves no tag behind.
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_KIND: ${{ inputs.prerelease && '--prerelease' || '--latest' }}
        run: >
          gh release create "$VERSION"
          "PackerAssistant-DB-$VERSION.zip" "PackerAssistant-DB-$VERSION.zip.sha256"
          --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA"
          --title "$VERSION" --generate-notes $RELEASE_KIND
