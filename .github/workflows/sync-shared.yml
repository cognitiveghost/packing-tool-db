name: Sync shared/ from shopify-fulfillment-tool

# Opens (or refreshes) one PR that mirrors shopify-fulfillment-tool-db's shared/
# at its main, via scripts/sync_shared.py. Merging it is still a choice: this
# repo may lag behind until Packing Tool is ready for what changed.

permissions:
  contents: write
  pull-requests: write

on:
  schedule:
    - cron: '0 6 * * 1'  # Mondays 06:00 UTC
  workflow_dispatch:

jobs:
  sync:
    name: Sync shared/
    runs-on: ubuntu-latest
    steps:
      - name: Check out this repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check out shopify-fulfillment-tool-db main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cognitiveghost/shopify-fulfillment-tool-db
          path: fulfilment-ref
          # Full history: sync_shared.py refuses a source that does not contain the last synced commit.
          fetch-depth: 0
          persist-credentials: false
      - name: Sync, and open or refresh the PR when shared/ changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/sync_shared.py fulfilment-ref
          if [ -z "$(git status --porcelain -- shared)" ]; then
            echo "shared/ already matches shopify-fulfillment-tool-db main."
            exit 0
          fi
          sha=$(tr -d '[:space:]' < scripts/shared_synced_from.txt)
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c sync/shared
          git add -A shared scripts/shared_synced_from.txt
          git commit -m "chore(shared): sync from shopify-fulfillment-tool-db@${sha:0:7}"
          git push --force origin sync/shared
          if [ -z "$(gh pr list --head sync/shared --state open --json number -q '.[].number')" ]; then
            gh pr create --base main --head sync/shared \
              --title "Sync shared/ from shopify-fulfillment-tool-db" \
              --body "Mirrors shopify-fulfillment-tool-db's \`shared/\` at its main, made by the sync-shared workflow. CI does not start on a PR opened by GitHub Actions: close and reopen this PR to run the checks."
          fi
